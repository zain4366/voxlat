name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (core only)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Install pymoo (Task 11 NSGA-II test; BoTorch/torch left out to keep CI light)
        run: pip install "pymoo>=0.6.1"
      - name: Run tests (fast)
        run: pytest -m "not slow"
